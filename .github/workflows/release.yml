name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Release macOS Apps
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run automated test suite
        run: npm test

      - name: Build macOS Apple Silicon (arm64)
        run: |
          npx @electron/packager . 'Gauge' --platform=darwin --arch=arm64 --out=dist --icon=assets/icon.icns --overwrite --app-bundle-id=com.tally.app --prune=true --ignore='(^/dist|^/Gauge\.app|^/test|^/\.git|^/config\.json|^/usage\.jsonl)'
          cp assets/icon.icns dist/Gauge-darwin-arm64/Gauge.app/Contents/Resources/electron.icns || true
          hdiutil create -volname "Gauge" -srcfolder dist/Gauge-darwin-arm64/Gauge.app -ov -format UDZO dist/Gauge-AppleSilicon-arm64.dmg
          cd dist && zip -r -y Gauge-AppleSilicon-arm64.zip Gauge-darwin-arm64/Gauge.app && cd ..

      - name: Build macOS Intel (x64)
        run: |
          npx @electron/packager . 'Gauge' --platform=darwin --arch=x64 --out=dist --icon=assets/icon.icns --overwrite --app-bundle-id=com.tally.app --prune=true --ignore='(^/dist|^/Gauge\.app|^/test|^/\.git|^/config\.json|^/usage\.jsonl)'
          cp assets/icon.icns dist/Gauge-darwin-x64/Gauge.app/Contents/Resources/electron.icns || true
          hdiutil create -volname "Gauge" -srcfolder dist/Gauge-darwin-x64/Gauge.app -ov -format UDZO dist/Gauge-Intel-x64.dmg
          cd dist && zip -r -y Gauge-Intel-x64.zip Gauge-darwin-x64/Gauge.app && cd ..

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Gauge-AppleSilicon-arm64.dmg
            dist/Gauge-AppleSilicon-arm64.zip
            dist/Gauge-Intel-x64.dmg
            dist/Gauge-Intel-x64.zip
          generate_release_notes: true
